site_name: 钱实明的个人网站
site_url: https://ryan-qsm.github.io/
site_description: 钱实明的个人网站，记录学习笔记与生活分享
site_author: 钱实明

repo_url: https://github.com/Ryan-qsm/ryan-qsm.github.io
repo_name: Ryan-qsm/ryan-qsm.github.io

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: white
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.tooltips

plugins:
  - search:
      separator: '[\s\u200b\-]'
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/hero-bg.js
  - javascripts/daily-pick.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ryan-qsm
      name: GitHub

copyright: Copyright &copy; 2026 钱实明

nav:
  - 主页: index.md
  - 课程: course/index.md
  - 旅行: travel/index.md
  - 文学:
      - 每日书籍推荐: literature/index.md
      - 我的阅读: literature/reading.md
  - 电影:
      - 每日电影推荐: movie/index.md
      - 我的观影: movie/watching.md
  - 美食: food/index.md
  - 学习记录: study/index.md
  - 体育: sports/index.md
  - 友链: friends/index.md
  - 关于: about/index.md
