name: Build and Deploy to gh-pages

on:
  push:
    branches:
      - main
  schedule:
    # 每天 01:00 UTC（北京时间 09:00）自动抓取最新壁纸并重新发布
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 抓取必应壁纸
        run: python tools/fetch_bing.py

      - name: 安装 mkdocs-material 和插件
        run: pip install mkdocs-material mkdocs-glightbox

      - name: 构建网站
        run: mkdocs build

      - name: 发布到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
